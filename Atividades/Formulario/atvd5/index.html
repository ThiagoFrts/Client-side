<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Cadastro de Vaga</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <form>

        <h1>Cadastro de Vaga</h1>

        <fieldset>
            <legend>Dados Pessoais</legend>

            <label>Nome completo:</label>
            <input type="text">

            <label>CPF:</label>
            <input type="text">

            <label>RG:</label>
            <input type="text">

            <label>Data de nascimento:</label>
            <input type="date">

            <label>Sexo:</label>
            <select>
                <option>Masculino</option>
                <option>Feminino</option>
                <option>Outro</option>
            </select>
        </fieldset>

        <fieldset>
            <legend>Contato</legend>

            <label>E-mail:</label>
            <input type="email">

            <label>Telefone:</label>
            <input type="text">

            <label>Celular:</label>
            <input type="text">
        </fieldset>

        <fieldset>
            <legend>Endereço</legend>

            <label>Rua:</label>
            <input type="text">

            <label>Número:</label>
            <input type="number">

            <label>Bairro:</label>
            <input type="text">

            <label>Cidade:</label>
            <input type="text">

            <label>Estado:</label>
            <input type="text">
        </fieldset>

        <fieldset>
            <legend>Informações Profissionais</legend>

            <label>Escolaridade:</label>
            <input type="text">

            <label>Cursos:</label>
            <textarea></textarea>

            <label>Experiência profissional:</label>
            <textarea></textarea>

            <label>Pretensão salarial:</label>
            <input type="text">
        </fieldset>

        <fieldset>
            <legend>Tecnologias</legend>

            <input type="checkbox"> HTML <br>
            <input type="checkbox"> CSS <br>
            <input type="checkbox"> JavaScript <br>
            <input type="checkbox"> Java <br>
            <input type="checkbox"> Python <br>
            <input type="checkbox"> Banco de Dados
        </fieldset>

        <fieldset>
            <legend>Envio de Currículo</legend>

            <input type="file">
        </fieldset>

        <button type="submit">Cadastrar</button>

    </form>

</body>

</html>
