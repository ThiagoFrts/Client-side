<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Formulário</title>
</head>

<body>

    <h2><strong>Cadastro Escolar</strong></h2>

    <div class="formulario">
        <form action="insere.php" method="post">

            <label for="nome">Nome:</label>
            <br>
            <input type="text" id="nome" name="nome" size="30" placeholder="Digite seu nome" maxlength="30">
            <br><br>

            <label for="telefone">Telefone:</label>
            <br>
            <input type="tel" id="telefone" name="telefone" size="30" placeholder="Digite seu telefone" maxlength="30">
            <br><br>

            <label for="email">E-mail:</label>
            <br>
            <input type="email" id="email" name="email" size="30" placeholder="Digite seu email" maxlength="30">
            <br><br>

            <label for="data">Data de nascimento:</label>
            <br>
            <input type="date" id="data" name="data">
            <br><br>

            <label for="estado">Estado:</label>
            <br>
            <input type="text" id="estado" name="estado" size="30" placeholder="Digite seu estado" maxlength="30">
            <br><br>

            <label for="cidade">Cidade:</label>
            <br>
            <input type="text" id="cidade" name="cidade" size="30" placeholder="Digite sua cidade" maxlength="30">
            <br><br>

            <label for="senha">Senha:</label>
            <br>
            <input type="password" id="cidade" name="cidade" size="30" placeholder="Digite sua senha" maxlength="30">
            <br><br>

            <div class="button">
                <input type="submit" value="OK">
                <input type="reset" value="Resetar">
            </div>

        </form>
    </div>

</body>

</html>
