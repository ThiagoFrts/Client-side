<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Cadastro Escolar</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <form>

        <h1>Cadastro de Aluno</h1>

        
            <legend>Dados Pessoais</legend>

            <label>Nome do aluno:</label>
            <input type="text">

            <label>Nome da mãe:</label>
            <input type="text">

            <label>Nome do pai:</label>
            <input type="text">

            <label>CPF:</label>
            <input type="text">

            <label>RG:</label>
            <input type="text">

            <label>Data de nascimento:</label>
            <input type="date">
       

       

            <label>Endereço:</label>
            <textarea></textarea>

            <label>Bairro:</label>
            <input type="text">

            <label>CEP:</label>
            <input type="text">

            <label>Cidade:</label>
            <input type="text">

            <label>Estado:</label>
            <input type="text">
       
<br>
<br>
        <fieldset>
            <label>Série:</label>
            <select>
                <option>1º Ano</option>
                <option>2º Ano</option>
                <option>3º Ano</option>
            </select>

            <label>Turno:</label>
            <select>
                <option>Manhã</option>
                <option>Tarde</option>
                <option>Noite</option>
            </select>
        </fieldset>

        <button>Cadastrar</button>

    </form>

</body>

</html>
